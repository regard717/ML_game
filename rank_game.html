function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function App(){
  // 狀態管理：新增 login 階段、玩家名稱、排行榜資料
  var sp=su('login'),phase=sp[0],setPhase=sp[1];
  var spn=su(''),playerName=spn[0],setPlayerName=spn[1];
  var slb=su([]),leaderboard=slb[0],setLeaderboard=slb[1];
  
  var sq=su([]),qs=sq[0],setQs=sq[1];
  var sqi=su(0),qi=sqi[0],setQi=sqi[1];
  var ss=su(0),score=ss[0],setScore=ss[1];
  var sc=su(0),correct=sc[0],setCorrect=sc[1];
  var sk=su(0),streak=sk[0],setStreak=sk[1];
  var st=su(TM),timer=st[0],setTimer=st[1];
  var sch=su(null),chosen=sch[0],setChosen=sch[1];
  var sp2=su(0),pts=sp2[0],setPts=sp2[1];
  var sw=su([]),wrongAnswers=sw[0],setWrongAnswers=sw[1];

  // 讀取本地排行榜
  ue(function(){
    var savedBoard = JSON.parse(localStorage.getItem('mlKahootLeaderboard')||'[]');
    setLeaderboard(savedBoard);
  },[]);

  ue(function(){
    if(phase!=='playing')return;
    if(timer===0){
      setChosen(-1);setPts(0);setStreak(0);
      setWrongAnswers(function(w){return w.concat({q:qs[qi], chosen:-1});});
      setPhase('feedback');
      return;
    }
    var id=setTimeout(function(){setTimer(function(t){return t-1;});},1000);
    return function(){clearTimeout(id);};
  },[phase,timer,qs,qi]);

  function handleLogin(){
    if(playerName.trim()==='') return alert('請輸入你的名字喔！');
    setPhase('start');
  }

  function startGame(n){
    // 自動複製 ALL 陣列避免污染原始資料
    var db = JSON.parse(JSON.stringify(ALL));
    var qRaw = shuffle(db).slice(0,n);
    
    var q=qRaw.map(function(item){
      var correctText=item.o[item.a];       
      var newOpts=shuffle(item.o);          
      var newA=newOpts.indexOf(correctText); 
      return { c: item.c, q: item.q, o: newOpts, a: newA };
    });

    setQs(q);setQi(0);setScore(0);setCorrect(0);setStreak(0);
    setTimer(TM);setChosen(null);setPts(0);
    setWrongAnswers([]);
    setPhase('playing');
  }

  function answer(idx){
    if(phase!=='playing')return;
    var q=qs[qi];
    if(idx===q.a){
      var e=Math.max(100,Math.round(BP*timer/TM))+(streak>=2?150:0);
      setPts(e);
      setScore(function(s){return s+e;});
      setCorrect(function(c){return c+1;});
      setStreak(function(s){return s+1;});
    }else{
      setPts(0);setStreak(0);
      setWrongAnswers(function(w){return w.concat({q:q, chosen:idx});});
    }
    setChosen(idx);setPhase('feedback');
  }

  function next(){
    if(qi+1>=qs.length){
      // 遊戲結束，儲存分數到排行榜
      var newEntry = { name: playerName, score: score, acc: Math.round(correct/qs.length*100) };
      var updatedBoard = leaderboard.concat(newEntry).sort(function(a,b){return b.score - a.score}).slice(0, 10);
      localStorage.setItem('mlKahootLeaderboard', JSON.stringify(updatedBoard));
      setLeaderboard(updatedBoard);
      setPhase('done');
      return;
    }
    setQi(function(i){return i+1;});setTimer(TM);setChosen(null);setPts(0);setPhase('playing');
  }

  var btnS=function(bg){return{display:'block',width:'100%',background:bg,color:'white',border:'none',borderRadius:30,padding:'13px 0',fontSize:14,fontWeight:'bold',marginBottom:10};};

  // 階段 1：登入畫面 (輸入名稱)
  if(phase==='login'){
    return h('div',{style:{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      h('div',{style:{textAlign:'center',maxWidth:320,width:'100%'}},
        h('div',{style:{fontSize:72,marginBottom:15}},'🎮'),
        h('div',{style:{color:'white',fontSize:26,fontWeight:'bold',marginBottom:20}},'歡迎來到 ML 競答'),
        h('input',{className:'name-input',placeholder:'請輸入你的暱稱...',value:playerName,
          onChange:function(e){setPlayerName(e.target.value)},
          onKeyDown:function(e){if(e.key==='Enter')handleLogin()}
        }),
        h('button',{className:'btn-name',onClick:handleLogin,style:btnS('#1368ce')},'準備就緒 🚀')
      )
    );
  }

  // 階段 2：選擇模式
  if(phase==='start'){
    return h('div',{style:{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      h('div',{style:{textAlign:'center',maxWidth:360,width:'100%'}},
        h('div',{style:{color:'#ffee66',fontSize:16,fontWeight:'bold',marginBottom:10}},'哈囉，' + playerName + '！'),
        h('div',{style:{fontSize:56,marginBottom:8}},'🧠'),
        h('div',{style:{color:'white',fontSize:24,fontWeight:'bold',marginBottom:4}},'選擇挑戰模式'),
        h('div',{style:{color:'rgba(255,255,255,0.5)',fontSize:12,marginBottom:24,lineHeight:1.6}},
          '共 '+ALL.length+' 道題目・答題越快，得分越高！'),
        h('button',{className:'ks',onClick:function(){startGame(ALL.length);},style:btnS('#26890c')},'🏆 全題挑戰 — '+ALL.length+' 題'),
        h('button',{className:'ks',onClick:function(){startGame(Math.min(40, ALL.length));},style:btnS('#1368ce')},'🎯 標準模式 — 40 題'),
        h('button',{className:'ks',onClick:function(){startGame(Math.min(20, ALL.length));},style:Object.assign({},btnS('#e21b3c'),{marginBottom:0})},'⚡ 快速模式 — 20 題')
      )
    );
  }

  // 階段 4：結果與排行榜
  if(phase==='done'){
    var pct=qs.length>0?Math.round(correct/qs.length*100):0;
    var isTop3 = leaderboard.findIndex(function(l){return l.name===playerName && l.score===score}) < 3;
    
    return h('div',{style:{background:BG,minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',padding:'30px 20px'}},
      h('div',{style:{textAlign:'center',maxWidth:400,width:'100%'}},
        // 個人成績
        h('div',{style:{background:'rgba(0,0,0,0.25)',borderRadius:15,padding:'20px',marginBottom:20}},
          h('div',{style:{color:'white',fontSize:20,fontWeight:'bold'}},isTop3?'🎉 恭喜上榜！':'遊戲結束！'),
          h('div',{style:{color:'#ffa500',fontSize:42,fontWeight:'bold',margin:'5px 0'}},score.toLocaleString()),
          h('div',{style:{color:'rgba(255,255,255,0.8)',fontSize:14}},'正確率 '+pct+'% ('+correct+'/'+qs.length+')')
        ),
        
        // 排行榜
        h('div',{className:'lb-list', style:{background:'white',borderRadius:15,padding:'20px 15px',marginBottom:20,textAlign:'left'}},
          h('div',{style:{color:'#333',fontSize:18,fontWeight:'bold',marginBottom:15,textAlign:'center'}},'🏆 本地排行榜 Top 10'),
          leaderboard.map(function(entry, i){
            var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
            var color = i===0?'#d89e00':i===1?'#8a9ca8':i===2?'#cd7f32':'#666';
            var isMe = entry.name === playerName && entry.score === score;
            return h('div',{key:i,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px',borderBottom:'1px solid #eee',background:isMe?'#fff9e6':'transparent',borderRadius:isMe?8:0}},
              h('div',{style:{display:'flex',alignItems:'center',gap:10}},
                h('span',{style:{fontSize:18,width:24,textAlign:'center',color:color,fontWeight:'bold'}},medal),
                h('span',{style:{fontSize:16,fontWeight:isMe?'bold':'normal',color:'#333'}},entry.name)
              ),
              h('div',{style:{textAlign:'right'}},
                h('div',{style:{fontSize:16,fontWeight:'bold',color:'#333'}},entry.score.toLocaleString()),
                h('div',{style:{fontSize:11,color:'#888'}},entry.acc+'% 正確率')
              )
            );
          })
        ),

        // 錯題回顧
        wrongAnswers.length > 0 ? h('div',{className:'wa-list', style:{background:'rgba(0,0,0,0.2)',borderRadius:10,padding:'15px 15px 5px',marginBottom:20,textAlign:'left',maxHeight:200,overflowY:'auto'}},
          h('div',{style:{color:'#ffa500',fontSize:15,fontWeight:'bold',marginBottom:12}},'錯題回顧：'),
          wrongAnswers.map(function(wa,i){
            var wq=wa.q;
            var uAns=wa.chosen===-1?'時間到 (未作答)':wq.o[wa.chosen];
            var cAns=wq.o[wq.a];
            return h('div',{key:i,style:{marginBottom:12,paddingBottom:12,borderBottom:i===wrongAnswers.length-1?'none':'1px solid rgba(255,255,255,0.1)'}},
              h('div',{style:{color:'white',fontSize:13,marginBottom:6,lineHeight:1.4}},(i+1)+'. '+wq.q),
              h('div',{style:{color:'#ff5555',fontSize:12,marginBottom:3}},'✗ 你的答案：'+uAns),
              h('div',{style:{color:'#4dff6e',fontSize:12}},'✓ 正確答案：'+cAns)
            );
          })
        ) : null,

        h('button',{className:'ks',onClick:function(){setPhase('start');},style:Object.assign({},btnS('#1368ce'),{marginBottom:0})},'再玩一次 🔄')
      )
    );
  }

  // 階段 3：遊戲進行中 (playing / feedback)
  var q=qs[qi]||{};
  var circ=2*Math.PI*22;
  var tFrac=Math.max(0,timer/TM);
  var tClr=timer<=5?'#ff5555':timer<=10?'#ffcc00':'#fff';
  var isRight=phase==='feedback'&&chosen===q.a;
  var timedOut=chosen===-1;

  return h('div',{style:{background:BG,padding:'12px 12px 18px',minHeight:'100vh'}},
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}},
      h('div',{style:{minWidth:64}},
        h('div',{style:{color:'white',fontSize:11}},h('span',{style:{fontSize:18,fontWeight:'bold'}},qi+1),'/'+qs.length),
        h('div',{style:{background:'rgba(255,255,255,0.18)',height:3,borderRadius:2,marginTop:4}},
          h('div',{style:{background:'white',height:3,borderRadius:2,width:(qi/qs.length*100)+'%',transition:'width .5s ease'}})
        )
      ),
      h('svg',{width:52,height:52,viewBox:'0 0 52 52'},
        h('circle',{cx:26,cy:26,r:22,fill:'rgba(0,0,0,0.3)',stroke:'rgba(255,255,255,0.12)',strokeWidth:5}),
        h('circle',{cx:26,cy:26,r:22,fill:'none',stroke:tClr,strokeWidth:5,
          strokeDasharray:(circ*tFrac)+' '+circ,strokeLinecap:'round',transform:'rotate(-90 26 26)',
          style:{transition:'stroke-dasharray .9s linear,stroke .3s'}}),
        h('text',{x:26,y:31,textAnchor:'middle',fill:'white',fontSize:15,fontWeight:'bold',fontFamily:'Arial,sans-serif'},timer)
      ),
      h('div',{style:{textAlign:'right',minWidth:80}},
        h('div',{style:{color:'#ffa500',fontSize:15,fontWeight:'bold'}},'⭐ '+score.toLocaleString()),
        streak>=3?h('div',{style:{color:'#ffee66',fontSize:10,marginTop:2}},'🔥 '+streak+'連勝！'):null
      )
    ),
    h('div',{style:{textAlign:'center',marginBottom:7}},
      h('span',{style:{background:'rgba(255,255,255,0.16)',color:'rgba(255,255,255,0.9)',borderRadius:10,padding:'3px 10px',fontSize:10}},q.c)
    ),
    h('div',{style:{background:'white',borderRadius:10,padding:'14px 16px',marginBottom:8,minHeight:82,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center'}},
      h('div',{style:{fontWeight:700,fontSize:20,color:'#111',lineHeight:1.5,marginBottom:3}},q.q)
    ),
    h('div',{style:{height:24,textAlign:'center',marginBottom:7,display:'flex',alignItems:'center',justifyContent:'center'}},
      phase==='feedback'
        ?(isRight
          ?h('span',{style:{color:'#4dff6e',fontSize:14,fontWeight:'bold'}},'✓ 答對！+'+pts.toLocaleString()+(streak>1?' 🔥'+streak+'連勝':''))
          :(timedOut
            ?h('span',{style:{color:'#ff5555',fontSize:14,fontWeight:'bold'}},'⏱ 時間到！')
            :h('span',{style:{color:'#ff5555',fontSize:14,fontWeight:'bold'}},'✗ 答錯了！')
          )
        ):null
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}},
      (q.o||[]).map(function(opt,i){
        var op=1,bdr='2px solid transparent';
        if(phase==='feedback'){
          if(i===q.a)bdr='3px solid white';
          else if(i===chosen)op=0.38;
          else op=0.24;
        }
        return h('button',{key:i,className:'kb',onClick:function(){answer(i);},disabled:phase!=='playing',
          style:{background:COL[i],border:bdr,borderRadius:8,padding:'10px 8px',cursor:phase==='playing'?'pointer':'default',opacity:op,minHeight:70,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,transition:'opacity .22s'}},
          h('span',{style:{fontSize:16,color:'white'}},ICO[i]),
          h('span',{style:{color:'white',fontWeight:700,fontSize:16,lineHeight:1.3,textAlign:'center'}},opt)
        );
      })
    ),
    phase==='feedback'
      ?h('div',{style:{textAlign:'center'}},
          h('button',{className:'ks',onClick:next,style:{background:'rgba(255,255,255,0.16)',border:'2px solid rgba(255,255,255,0.75)',borderRadius:25,color:'white',padding:'9px 28px',fontSize:13,fontWeight:'bold'}},
            qi+1>=qs.length?'查看結果 🎉':'下一題 →'
          )
        ):null
  );
}

ReactDOM.createRoot(document.getElementById('krt')).render(h(App));
})();
</script>
</body>
</html>
